name: Auto Scraper SIMKOPDES DVC Pipeline (Parallel)

on:
  workflow_dispatch: # Pemicu tombol manual di GitHub Actions
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari pukul 00:00 UTC

permissions:
  contents: write

jobs:
  scrape_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [scrape_provinces, scrape_regencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Reproduce DVC Stage (${{ matrix.stage }})
        run: dvc repro ${{ matrix.stage }}

      - name: Push Data to Cloudflare R2 (DVC Remote)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: dvc push || echo "DVC Push skipped if R2 credentials not configured."

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-${{ matrix.stage }}
          path: dvc.lock

  sync_commit:
    needs: scrape_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & DVC
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DVC
        run: pip install dvc

      - name: Download all Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Sync & Commit Updated Lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock .dvc/config data/raw/.gitignore params.yaml
          git commit -m "auto: parallel reproduce DVC pipeline & sync lockfile [skip ci]" || echo "Tidak ada perubahan data."
          git push
