name: Auto Scraper & DVC Data Pipeline

on:
  workflow_dispatch: # Pemicu tombol manual di GitHub Actions
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari pukul 00:00 UTC

permissions:
  contents: write

jobs:
  scrape_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [scrape_provinces, scrape_regencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment & Playwright
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'true'

      - name: Reproduce Parallel DVC Stage (${{ matrix.stage }})
        run: dvc repro ${{ matrix.stage }}

      - name: Push Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-${{ matrix.stage }}
          path: dvc.lock

  pipeline_sequential:
    needs: scrape_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce Sequential Pipeline (preprocess & eda)
        run: dvc repro preprocess eda

      - name: Push Processed Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Commit & Push Updated Lockfile and Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock .dvc/config data/processed/.gitignore reports/
          git commit -m "auto: reproduce sequential preprocess & eda pipeline [skip ci]" || echo "Tidak ada perubahan data."
          git push
