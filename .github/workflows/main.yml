name: SIMKOPDES End-to-End Data Pipeline

on:
  workflow_dispatch:
    inputs:
      force_repro:
        description: 'Paksa eksekusi ulang seluruh stage pipeline DVC (--force)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari pukul 00:00 UTC

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  scrape_matrix:
    name: Parallel Scraping (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [scrape_provinces, scrape_regencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment & Playwright
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'true'

      - name: Reproduce Parallel DVC Stage (${{ matrix.stage }})
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --force ${{ matrix.stage }}
          else
            dvc repro ${{ matrix.stage }}
          fi

      - name: Push Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-${{ matrix.stage }}
          path: dvc.lock

  pipeline_sequential:
    name: Sequential Pipeline (Preprocess & EDA)
    needs: scrape_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce Sequential Pipeline (preprocess & eda)
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --force preprocess eda
          else
            dvc repro preprocess eda
          fi

      - name: Push Processed Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v1

      - name: Generate & Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Laporan Pemrosesan Data SIMKOPDES DVC" > cml_report.md
          echo "" >> cml_report.md
          cat reports/eda_summary.md >> cml_report.md
          echo "" >> cml_report.md
          echo "## Metrik DVC" >> cml_report.md
          dvc metrics show --markdown >> cml_report.md

          cml comment create cml_report.md || echo "CML comment created."

      - name: Commit & Push Updated Lockfile and Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock .dvc/config data/preprocess/.gitignore reports/
          git commit -m "auto: reproduce sequential preprocess & eda pipeline [skip ci]" || echo "Tidak ada perubahan data."
          git push
