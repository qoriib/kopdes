name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Scraping
  # ──────────────────────────────────────────────
  scrape:
    name: Scrape Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Install Playwright
        shell: bash
        run: playwright install chromium --with-deps

      - name: Scrape Province Data
        run: dvc repro -s scrape_provinces

      - name: Scrape Regency Data
        run: dvc repro -s scrape_regencies

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update scrape stage artifacts [skip ci]"

      - name: Upload Scrape Files
        uses: actions/upload-artifact@v7
        with:
          name: scrape-files
          path: |
            data/raw/scraped_provinces.csv
            data/raw/scraped_regencies.csv

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Transform
        run: dvc repro -s transform

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update transform stage artifacts [skip ci]"

      - name: Upload Transform Files
        uses: actions/upload-artifact@v7
        with:
          name: transform-files
          path: |
            data/transform/transformed_provinces.csv
            data/transform/transformed_regencies.csv

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run EDA
        run: dvc repro -s eda

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update eda stage artifacts [skip ci]"

      - name: Generate & Post CML EDA Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/eda_summary.md \
            --output reports/cml_eda.md \
            --title "CML: Laporan EDA SIMKOPDES"
          cml comment create reports/cml_eda.md
          cat reports/cml_eda.md >> $GITHUB_STEP_SUMMARY

      - name: Upload EDA Files
        uses: actions/upload-artifact@v7
        with:
          name: eda-files
          path: |
            reports/eda_metrics.json
            reports/eda_summary.md
            reports/figures/eda_top_provinces.png
            reports/figures/eda_top_regencies_transaksi.png

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Preprocessing
        run: dvc repro -s preprocess

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update preprocess stage artifacts [skip ci]"

      - name: Generate & Post CML Preprocess Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/preprocess_report.md \
            --output reports/cml_preprocess.md \
            --title "CML: Laporan Preprocessing SIMKOPDES"
          cml comment create reports/cml_preprocess.md
          cat reports/cml_preprocess.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Preprocess Files
        uses: actions/upload-artifact@v7
        with:
          name: preprocess-files
          path: |
            data/preprocess/scaled_features.csv
            data/preprocess/preprocess_meta.json
            reports/preprocess_report.md
            reports/figures/preprocess_elbow_curve.png

  # ──────────────────────────────────────────────
  # Stage 4: KMeans Clustering
  # ──────────────────────────────────────────────
  model:
    name: KMeans Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Model Training
        run: dvc repro -s model

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update model stage artifacts [skip ci]"

      - name: Upload Model Files
        uses: actions/upload-artifact@v7
        with:
          name: model-files
          path: |
            models/kmeans_model.pkl
            data/model/clustered_regencies.csv

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run Evaluation
        run: dvc repro -s evaluate

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update evaluate stage artifacts [skip ci]"

      - name: Generate & Post CML Evaluate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/evaluate_report.md \
            --output reports/cml_evaluate.md \
            --title "CML: Laporan Evaluasi Clustering SIMKOPDES"
          cml comment create reports/cml_evaluate.md
          cat reports/cml_evaluate.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Evaluate Files
        uses: actions/upload-artifact@v7
        with:
          name: evaluate-files
          path: |
            reports/evaluate_report.md
            reports/evaluate_metrics.json
            reports/figures/eval_pca_projection.png
            reports/figures/eval_cluster_distribution.png
            reports/figures/eval_avg_transaction.png

  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro -s interpret

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update interpret stage artifacts [skip ci]"

      - name: Generate & Post CML Interpret Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/interpret_report.md \
            --output reports/cml_interpret.md \
            --title "CML: Laporan Interpretasi AI SIMKOPDES"
          cml comment create reports/cml_interpret.md
          cat reports/cml_interpret.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Interpret Files
        uses: actions/upload-artifact@v7
        with:
          name: interpret-files
          path: |
            reports/interpret_report.md
            reports/interpret_labels.json

  store:
    name: Store Data
    needs: interpret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Apply Remote Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 migrations apply simkopdes_db --remote

      - name: Run DVC Store Stage
        run: dvc repro -s store

      - name: Seed Remote Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 execute simkopdes_db --remote --file=../../data/seed.sql

      - name: Upload Store Files
        uses: actions/upload-artifact@v7
        with:
          name: store-files
          path: |
            data/seed.sql



  deploy_backend:
    name: Deploy Backend
    needs: store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/backend
          npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler deploy --minify

  deploy_frontend:
    name: Deploy Frontend
    needs: store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/frontend
          npx wrangler pages deploy