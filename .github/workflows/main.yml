name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Parallel Scraping
  # ──────────────────────────────────────────────
  scrape_provinces:
    name: Scrape Provinces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Scrape Province Data
        run: dvc repro scrape_provinces

      - name: DVC Push
        run: dvc push

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-scrape-provinces
          path: dvc.lock

  scrape_regencies:
    name: Scrape Regencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Scrape Regency Data
        run: dvc repro scrape_regencies

      - name: DVC Push
        run: dvc push

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-scrape-regencies
          path: dvc.lock

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: [scrape_provinces, scrape_regencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Locks
        uses: actions/download-artifact@v8
        with:
          pattern: dvc-lock-scrape-*
          merge-multiple: false

      - name: Merge DVC Locks
        run: |
          python -c '
          import yaml, glob
          merged = {"schema": "2.0", "stages": {}}
          for path in glob.glob("dvc-lock-scrape-*/dvc.lock"):
              with open(path) as f:
                  lock_data = yaml.safe_load(f) or {}
                  merged["stages"].update(lock_data.get("stages", {}))
          with open("dvc.lock", "w") as f:
              yaml.dump(merged, f)
          '
          rm -rf dvc-lock-scrape-*

      - name: DVC Pull Raw Data
        run: dvc pull

      - name: Run Transform
        run: dvc repro transform

      - name: DVC Push
        run: dvc push

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-transform
          path: dvc.lock

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Lock
        uses: actions/download-artifact@v8
        with:
          name: dvc-lock-transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run EDA
        run: dvc repro eda

      - name: DVC Push
        run: dvc push

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML EDA Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/eda_summary.md

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-eda
          path: dvc.lock

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Lock
        uses: actions/download-artifact@v8
        with:
          name: dvc-lock-transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run Preprocessing
        run: dvc repro preprocess

      - name: DVC Push
        run: dvc push

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-preprocess
          path: dvc.lock

  # ──────────────────────────────────────────────
  # Stage 4: KMeans Clustering
  # ──────────────────────────────────────────────
  model:
    name: KMeans Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Lock
        uses: actions/download-artifact@v8
        with:
          name: dvc-lock-preprocess

      - name: DVC Pull Preprocessed & Transformed Data
        run: dvc pull

      - name: Run Model Training
        run: dvc repro model

      - name: DVC Push
        run: dvc push

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-model
          path: dvc.lock

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Locks
        uses: actions/download-artifact@v8
        with:
          pattern: dvc-lock-{eda,model}
          merge-multiple: false

      - name: Merge DVC Locks
        run: |
          python -c '
          import yaml, glob
          merged = {"schema": "2.0", "stages": {}}
          for path in glob.glob("dvc-lock-*/dvc.lock"):
              with open(path) as f:
                  lock_data = yaml.safe_load(f) or {}
                  merged["stages"].update(lock_data.get("stages", {}))
          with open("dvc.lock", "w") as f:
              yaml.dump(merged, f)
          '
          rm -rf dvc-lock-eda dvc-lock-model

      - name: DVC Pull All Upstream Data
        run: dvc pull

      - name: Run Evaluation
        run: dvc repro evaluate

      - name: DVC Push
        run: dvc push

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML Evaluation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/evaluate_report.md

      - name: Upload DVC Lock
        uses: actions/upload-artifact@v7
        with:
          name: dvc-lock-evaluate
          path: dvc.lock

  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Download Upstream DVC Lock
        uses: actions/download-artifact@v8
        with:
          name: dvc-lock-evaluate

      - name: DVC Pull Upstream Data
        run: dvc pull

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro interpret

      - name: DVC Push
        run: dvc push

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML AI Interpretation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/interpret_report.md

      - name: Commit & Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update DVC tracking files and AI reports [skip ci]"
            git pull --rebase origin main
            git push
          fi

