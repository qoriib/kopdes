name: End-to-End CRISP-DM Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

env:
  # Cloudflare R2 / S3 Credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Cloudflare Account & API Credentials (used by DVC, Wrangler, D1 & Pages)
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # R2 Storage Configuration
  R2_BUCKET: kopdes-cml
  R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

jobs:
  scrape:
    name: Web Scraping - SIMKOPDES Ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Install Playwright
        shell: bash
        run: playwright install chromium --with-deps

      - name: Run Scraper Script
        shell: bash
        run: python src/0_scrape.py

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update scrape stage artifacts [skip ci]"

      - name: Upload Scrape Files
        uses: actions/upload-artifact@v7
        with:
          name: scrape-files
          path: |
            data/0_scrape/scraped_provinces.csv
            data/0_scrape/scraped_regencies.csv

  pipeline:
    name: Run CRISP-DM DVC Pipeline
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC Pipeline
        run: dvc repro

      - name: Generate Reports & Upload Plots to R2
        run: |
          upload_to_r2() {
            local file_path="$1"
            local filename=$(basename "$file_path")
            local key="reports/${filename}"
            local endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
            local base_url="${R2_PUBLIC_URL:-https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}}"

            aws s3 cp "$file_path" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "image/png" > /dev/null

            echo "${base_url}/${key}"
          }

          for stage in 1_understanding 3_modeling 4_evaluation; do
            jupyter nbconvert --to markdown --no-input src/outs/${stage}.ipynb --output-dir src/outs
            for img in src/outs/${stage}_files/*.png; do
              [ -f "$img" ] || continue
              url=$(upload_to_r2 "$img")
              filename=$(basename "$img")
              sed -i "s|](${stage}_files/${filename})|]($url)|g" src/outs/${stage}.md
            done
            cat src/outs/${stage}.md >> $GITHUB_STEP_SUMMARY
          done

      - name: Apply Remote Database Migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'web/backend'
          command: d1 migrations apply simkopdes_db --remote

      - name: Seed Remote Database
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'web/backend'
          command: d1 execute simkopdes_db --remote --file=../../data/5_deployment/seed.sql

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update pipeline artifacts [skip ci]"

      - name: Upload Notebook Outputs
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: |
            src/outs/*

      - name: Upload Prepared Files
        uses: actions/upload-artifact@v7
        with:
          name: prepared-files
          path: |
            data/2_preparation/cleaned_provinces.csv
            data/2_preparation/cleaned_regencies.csv
            data/2_preparation/scaled_features.csv

      - name: Upload Modeling Files
        uses: actions/upload-artifact@v7
        with:
          name: modeling-files
          path: |
            models/kmeans_model.pkl
            data/3_modeling/clustered_regencies.csv

      - name: Upload Deployment Files
        uses: actions/upload-artifact@v7
        with:
          name: deployment-files
          path: |
            data/5_deployment/seed.sql

  deploy_backend:
    name: Deploy Backend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/backend
          npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'web/backend'
          command: deploy --minify

  deploy_frontend:
    name: Deploy Frontend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'web/frontend'
          command: pages deploy