name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Parallel Scraping
  # ──────────────────────────────────────────────
  scrape_provinces:
    name: Scrape Provinces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment & Playwright
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'true'

      - name: Scrape Province Data
        run: python src/scrape_provinces.py

      - name: DVC Add & Push
        run: |
          dvc add data/raw/scraped_provinces.csv
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-scrape-provinces
          path: |
            data/raw/scraped_provinces.csv.dvc
            data/raw/.gitignore

  scrape_regencies:
    name: Scrape Regencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment & Playwright
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'true'

      - name: Scrape Regency Data
        run: python src/scrape_regencies.py

      - name: DVC Add & Push
        run: |
          dvc add data/raw/scraped_regencies.csv
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-scrape-regencies
          path: |
            data/raw/scraped_regencies.csv.dvc
            data/raw/.gitignore

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: [scrape_provinces, scrape_regencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          pattern: dvc-files-scrape-*
          merge-multiple: true

      - name: DVC Pull Raw Data
        run: dvc pull

      - name: Run Transform
        run: python src/transform.py

      - name: DVC Add & Push
        run: |
          dvc add data/transform/transformed_provinces.csv \
                  data/transform/transformed_regencies.csv
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-transform
          path: |
            data/raw/*.dvc
            data/raw/.gitignore
            data/transform/*.dvc
            data/transform/.gitignore

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          name: dvc-files-transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run EDA
        run: python src/eda.py

      - name: DVC Add & Push
        run: |
          dvc add reports/eda_summary.md reports/metrics.json
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-eda
          path: |
            data/raw/*.dvc
            data/raw/.gitignore
            data/transform/*.dvc
            data/transform/.gitignore
            reports/*.dvc
            reports/.gitignore

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          name: dvc-files-transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run Preprocessing
        run: python src/preprocess.py

      - name: DVC Add & Push
        run: |
          dvc add data/preprocess/scaled_features.csv \
                  data/preprocess/preprocess_meta.json
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-preprocess
          path: |
            data/raw/*.dvc
            data/raw/.gitignore
            data/transform/*.dvc
            data/transform/.gitignore
            data/preprocess/*.dvc
            data/preprocess/.gitignore

  # ──────────────────────────────────────────────
  # Stage 4: Clustering
  # ──────────────────────────────────────────────
  model:
    name: Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          name: dvc-files-preprocess

      - name: DVC Pull Preprocessed & Transformed Data
        run: dvc pull

      - name: Run Model Training
        run: python src/model.py

      - name: DVC Add & Push
        run: |
          dvc add models/kmeans_model.pkl \
                  data/model/clustered_regencies.csv
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-model
          path: |
            data/**/*.dvc
            data/**/.gitignore
            models/*.dvc
            models/.gitignore

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          pattern: dvc-files-{eda,model}
          merge-multiple: true

      - name: DVC Pull All Upstream Data
        run: dvc pull

      - name: Run Evaluation
        run: python src/evaluate.py

      - name: DVC Add & Push
        run: |
          dvc add reports/clustering_report.md reports/model_metrics.json
          dvc push

      - name: Upload DVC Tracking Files
        uses: actions/upload-artifact@v4
        with:
          name: dvc-files-evaluate
          path: |
            data/**/*.dvc
            data/**/.gitignore
            models/*.dvc
            models/.gitignore
            reports/*.dvc
            reports/.gitignore

  # ──────────────────────────────────────────────
  # Stage 6: AI Interpretation
  # ──────────────────────────────────────────────
  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env

      - name: Download Upstream DVC Files
        uses: actions/download-artifact@v4
        with:
          name: dvc-files-evaluate

      - name: DVC Pull All Upstream Data
        run: dvc pull

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python src/interpret.py

      - name: DVC Add & Push
        run: |
          dvc add reports/ai_interpretation.md reports/cluster_labels.json
          dvc push

      - name: Setup CML
        uses: iterative/setup-cml@v1

      - name: Generate & Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull report files for CML (already local from dvc pull + script output)
          echo "# Laporan Pemrosesan Data & Machine Learning SIMKOPDES" > cml_report.md
          echo "" >> cml_report.md
          cat reports/eda_summary.md >> cml_report.md
          echo "" >> cml_report.md
          cat reports/clustering_report.md >> cml_report.md
          echo "" >> cml_report.md
          cat reports/ai_interpretation.md >> cml_report.md
          echo "" >> cml_report.md

          cml comment create cml_report.md || echo "CML comment created."

      - name: Commit & Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: update DVC tracking files and reports [skip ci]"
          git push
