name: End-to-End CRISP-DM Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  scrape:
    name: Web Scraping - SIMKOPDES Ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Install Playwright
        shell: bash
        run: playwright install chromium --with-deps

      - name: Run Scraper Script
        shell: bash
        run: python src/0_scrape.py

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update scrape stage artifacts [skip ci]"

      - name: Upload Scrape Files
        uses: actions/upload-artifact@v7
        with:
          name: scrape-files
          path: |
            data/0_scrape/scraped_provinces.csv
            data/0_scrape/scraped_regencies.csv

  pipeline:
    name: Run CRISP-DM DVC Pipeline
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update pipeline artifacts [skip ci]"

      - name: Generate & Post CML Data Understanding Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jupyter nbconvert --to html --no-input src/outs/1_understanding.ipynb --output-dir src/outs
          cml comment create src/outs/1_understanding.html
          cat src/outs/1_understanding.html >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Modeling Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jupyter nbconvert --to html --no-input src/outs/3_modeling.ipynb --output-dir src/outs
          cml comment create src/outs/3_modeling.html
          cat src/outs/3_modeling.html >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Evaluation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jupyter nbconvert --to html --no-input src/outs/4_evaluation.ipynb --output-dir src/outs
          cml comment create src/outs/4_evaluation.html
          cat src/outs/4_evaluation.html >> $GITHUB_STEP_SUMMARY

      - name: Apply Remote Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 migrations apply simkopdes_db --remote

      - name: Seed Remote Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 execute simkopdes_db --remote --file=../../data/5_deployment/seed.sql

      - name: Upload Notebook Outputs
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: |
            src/outs/*

      - name: Upload Prepared Files
        uses: actions/upload-artifact@v7
        with:
          name: prepared-files
          path: |
            data/2_preparation/cleaned_provinces.csv
            data/2_preparation/cleaned_regencies.csv
            data/2_preparation/scaled_features.csv

      - name: Upload Modeling Files
        uses: actions/upload-artifact@v7
        with:
          name: modeling-files
          path: |
            models/kmeans_model.pkl
            data/3_modeling/clustered_regencies.csv

      - name: Upload Deployment Files
        uses: actions/upload-artifact@v7
        with:
          name: deployment-files
          path: |
            data/5_deployment/seed.sql

  deploy_backend:
    name: Deploy Backend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/backend
          npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler deploy --minify

  deploy_frontend:
    name: Deploy Frontend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/frontend
          npx wrangler pages deploy