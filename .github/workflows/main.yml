name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Parallel Scraping
  # ──────────────────────────────────────────────
  scrape_provinces:
    name: Scrape Provinces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline
        with:
          install-playwright: 'true'

      - name: Scrape Province Data
        run: dvc repro scrape_provinces

      - name: DVC Push
        run: dvc push

  scrape_regencies:
    name: Scrape Regencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline
        with:
          install-playwright: 'true'

      - name: Scrape Regency Data
        run: dvc repro scrape_regencies

      - name: DVC Push
        run: dvc push

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: [scrape_provinces, scrape_regencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Raw Data
        run: dvc pull --run-cache

      - name: Run Transform
        run: dvc repro transform

      - name: DVC Push
        run: dvc push

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Transformed Data
        run: dvc pull --run-cache

      - name: Run EDA
        run: dvc repro eda

      - name: DVC Push
        run: dvc push

      - name: Post EDA Report to Step Summary
        run: cat reports/eda_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML EDA Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/eda_summary.md \
            --figures reports/figures/eda_top_provinces.png reports/figures/eda_top_regencies_transaksi.png \
            --output reports/cml_eda.md \
            --title "CML: Laporan EDA SIMKOPDES"
          cml comment create reports/cml_eda.md

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Transformed Data
        run: dvc pull --run-cache

      - name: Run Preprocessing
        run: dvc repro preprocess

      - name: DVC Push
        run: dvc push

      - name: Post Preprocess Report to Step Summary
        run: cat reports/preprocess_report.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Preprocess Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/preprocess_report.md \
            --figures reports/figures/preprocess_elbow_curve.png \
            --output reports/cml_preprocess.md \
            --title "CML: Laporan Preprocessing SIMKOPDES"
          cml comment create reports/cml_preprocess.md

  # ──────────────────────────────────────────────
  # Stage 4: KMeans Clustering
  # ──────────────────────────────────────────────
  model:
    name: KMeans Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Preprocessed & Transformed Data
        run: dvc pull --run-cache

      - name: Run Model Training
        run: dvc repro model

      - name: DVC Push
        run: dvc push

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull All Upstream Data
        run: dvc pull --run-cache

      - name: Run Evaluation
        run: dvc repro evaluate

      - name: DVC Push
        run: dvc push

      - name: Post Evaluation Report to Step Summary
        run: cat reports/evaluate_report.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Evaluate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/evaluate_report.md \
            --figures reports/figures/eval_pca_projection.png reports/figures/eval_cluster_distribution.png reports/figures/eval_avg_transaction.png \
            --output reports/cml_evaluate.md \
            --title "CML: Laporan Evaluasi Clustering SIMKOPDES"
          cml comment create reports/cml_evaluate.md

  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Upstream Data
        run: dvc pull --run-cache

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro interpret

      - name: DVC Push
        run: dvc push

      - name: Post AI Interpretation Report to Step Summary
        run: cat reports/interpret_report.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Interpret Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/interpret_report.md \
            --output reports/cml_interpret.md \
            --title "CML: Laporan Interpretasi AI SIMKOPDES"
          cml comment create reports/cml_interpret.md

  store_db:
    name: Store Data to Database
    needs: interpret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull Upstream Data
        run: dvc pull --run-cache

      - name: Apply Remote Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 migrations apply simkopdes_db --remote

      - name: Run DVC Store Stage
        run: dvc repro store

      - name: Seed Remote Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 execute simkopdes_db --remote --file=../../data/seed.sql

  artifact:
    name: Upload Artifacts
    needs: interpret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: DVC Pull All Reports
        run: dvc pull

      - name: Upload EDA Report
        uses: actions/upload-artifact@v4
        with:
          name: eda-report
          path: reports/eda_summary.md

      - name: Upload Preprocess Report
        uses: actions/upload-artifact@v4
        with:
          name: preprocess-report
          path: reports/preprocess_report.md

      - name: Upload Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: evaluate-report
          path: reports/evaluate_report.md

      - name: Upload AI Interpretation Report
        uses: actions/upload-artifact@v4
        with:
          name: interpret-report
          path: reports/interpret_report.md

      - name: Commit & Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update DVC tracking files and AI reports [skip ci]"
            git pull --rebase origin main
            git push
          fi

  deploy_backend:
    name: Deploy Backend
    needs: store_db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd web/backend
          npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler deploy --minify

  deploy_frontend:
    name: Deploy Frontend
    needs: store_db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/frontend
          npx wrangler pages project create simkopdes --production-branch main || true
          npx wrangler pages deploy dist --project-name=simkopdes --branch=main

