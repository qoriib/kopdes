name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Parallel Scraping
  # ──────────────────────────────────────────────
  scrape_provinces:
    name: Scrape Provinces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Scrape Province Data
        run: dvc exp run --name scrape-provinces scrape_provinces

      - name: Push DVC Experiment
        run: dvc exp push origin scrape-provinces

  scrape_regencies:
    name: Scrape Regencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Scrape Regency Data
        run: dvc exp run --name scrape-regencies scrape_regencies

      - name: Push DVC Experiment
        run: dvc exp push origin scrape-regencies

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: [scrape_provinces, scrape_regencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Merge DVC Locks
        run: python src/utils/dvc_exp_helper.py merge scrape-provinces scrape-regencies

      - name: DVC Pull Raw Data
        run: dvc pull

      - name: Run Transform
        run: dvc exp run --name transform transform

      - name: Push DVC Experiment
        run: dvc exp push origin transform

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Checkout DVC Lock
        run: python src/utils/dvc_exp_helper.py checkout transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run EDA
        run: dvc exp run --name eda eda

      - name: Push DVC Experiment
        run: dvc exp push origin eda

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML EDA Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/eda_summary.md

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Checkout DVC Lock
        run: python src/utils/dvc_exp_helper.py checkout transform

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run Preprocessing
        run: dvc exp run --name preprocess preprocess

      - name: Push DVC Experiment
        run: dvc exp push origin preprocess

  # ──────────────────────────────────────────────
  # Stage 4: KMeans Clustering
  # ──────────────────────────────────────────────
  model:
    name: KMeans Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Checkout DVC Lock
        run: python src/utils/dvc_exp_helper.py checkout preprocess

      - name: DVC Pull Preprocessed & Transformed Data
        run: dvc pull

      - name: Run Model Training
        run: dvc exp run --name model model

      - name: Push DVC Experiment
        run: dvc exp push origin model

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Merge DVC Locks
        run: python src/utils/dvc_exp_helper.py merge eda model

      - name: DVC Pull All Upstream Data
        run: dvc pull

      - name: Run Evaluation
        run: dvc exp run --name evaluate evaluate

      - name: Push DVC Experiment
        run: dvc exp push origin evaluate

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML Evaluation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/evaluate_report.md

  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: treeverse/setup-dvc@v3

      - name: Fetch DVC Experiments
        run: git fetch origin 'refs/exps/*:refs/exps/*'

      - name: Checkout DVC Lock
        run: python src/utils/dvc_exp_helper.py checkout evaluate

      - name: DVC Pull Upstream Data
        run: dvc pull

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc exp run --name interpret interpret

      - name: Push DVC Experiment
        run: dvc exp push origin interpret

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Post CML AI Interpretation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/interpret_report.md

