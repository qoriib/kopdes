name: End-to-End CRISP-DM Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  scrape:
    name: Web Scraping - SIMKOPDES Ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Install Playwright
        shell: bash
        run: playwright install chromium --with-deps

      - name: Scrape Province Data
        run: python src/scraper/scrape_provinces.py

      - name: Scrape Regency Data
        run: python src/scraper/scrape_regencies.py

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update scrape stage artifacts [skip ci]"

      - name: Upload Scrape Files
        uses: actions/upload-artifact@v7
        with:
          name: scrape-files
          path: |
            data/raw/scraped_provinces.csv
            data/raw/scraped_regencies.csv

  pipeline:
    name: Run CRISP-DM DVC Pipeline
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Run DVC Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro

      - name: Push Pipeline Data & Git State
        uses: ./.github/actions/push-pipeline
        with:
          commit-message: "auto: update pipeline artifacts [skip ci]"

      - name: Generate & Post CML Data Exploration Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/data_exploration_report.md \
            --output reports/cml_data_exploration.md \
            --title "Laporan Eksplorasi Data (CRISP-DM Data Understanding)"
          cml comment create reports/cml_data_exploration.md
          cat reports/cml_data_exploration.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Data Quality Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/data_quality_report.md \
            --output reports/cml_data_quality.md \
            --title "Laporan Verifikasi Kualitas Data"
          cml comment create reports/cml_data_quality.md
          cat reports/cml_data_quality.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Evaluate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/evaluate_report.md \
            --output reports/cml_evaluate.md \
            --title "Laporan Evaluasi Clustering"
          cml comment create reports/cml_evaluate.md
          cat reports/cml_evaluate.md >> $GITHUB_STEP_SUMMARY

      - name: Generate & Post CML Interpret Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/interpret_report.md \
            --output reports/cml_interpret.md \
            --title "Laporan Interpretasi AI"
          cml comment create reports/cml_interpret.md
          cat reports/cml_interpret.md >> $GITHUB_STEP_SUMMARY

      - name: Apply Remote Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 migrations apply simkopdes_db --remote

      - name: Seed Remote Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler d1 execute simkopdes_db --remote --file=../../data/seed.sql

      - name: Upload Data Understanding Files
        uses: actions/upload-artifact@v7
        with:
          name: data-understanding-files
          path: |
            reports/data_description_report.md
            reports/data_description_metrics.json
            reports/data_exploration_report.md
            reports/eda_metrics.json
            reports/data_quality_report.md
            reports/data_quality_metrics.json
            reports/figures/eda_top_provinces.png
            reports/figures/eda_top_regencies_transaksi.png
            reports/figures/eda_correlation_matrix.png
            reports/figures/eda_feature_distributions.png

      - name: Upload Prepared Files
        uses: actions/upload-artifact@v7
        with:
          name: prepared-files
          path: |
            data/prepared/cleaned_provinces.csv
            data/prepared/cleaned_regencies.csv
            data/prepared/scaled_features.csv
            data/prepared/preparation_meta.json

      - name: Upload Modeling Files
        uses: actions/upload-artifact@v7
        with:
          name: modeling-files
          path: |
            models/kmeans_model.pkl
            data/modeling/clustered_regencies.csv
            reports/figures/model_elbow_curve.png

      - name: Upload Evaluation Files
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-files
          path: |
            reports/evaluate_report.md
            reports/evaluate_metrics.json
            reports/figures/eval_pca_projection.png
            reports/figures/eval_cluster_distribution.png
            reports/figures/eval_avg_transaction.png

      - name: Upload Interpret Files
        uses: actions/upload-artifact@v7
        with:
          name: interpret-files
          path: |
            reports/interpret_report.md
            reports/interpret_labels.json

      - name: Upload Deployment Files
        uses: actions/upload-artifact@v7
        with:
          name: deployment-files
          path: |
            data/seed.sql

  deploy_backend:
    name: Deploy Backend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/backend
          npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/backend
          npx wrangler deploy --minify

  deploy_frontend:
    name: Deploy Frontend
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23

      - name: Install dependencies
        run: |
          cd web/frontend
          npm ci

      - name: Build Frontend
        run: |
          cd web/frontend
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web/frontend
          npx wrangler pages deploy