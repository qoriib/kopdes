name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Parallel Scraping
  # ──────────────────────────────────────────────
  scrape_provinces:
    name: Scrape Provinces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline
        with:
          install-playwright: 'true'

      - name: Scrape Province Data
        run: dvc repro scrape_provinces

      - name: DVC Push
        run: dvc push

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-provinces.lock

      - name: Cache Provinces Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-provinces.lock
          key: dvc-lock-provinces-${{ github.run_id }}-${{ github.run_attempt }}

  scrape_regencies:
    name: Scrape Regencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline
        with:
          install-playwright: 'true'

      - name: Scrape Regency Data
        run: dvc repro scrape_regencies

      - name: DVC Push
        run: dvc push

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-regencies.lock

      - name: Cache Regencies Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-regencies.lock
          key: dvc-lock-regencies-${{ github.run_id }}-${{ github.run_attempt }}

  # ──────────────────────────────────────────────
  # Stage 2: Data Transformation
  # ──────────────────────────────────────────────
  transform:
    name: Data Transformation
    needs: [scrape_provinces, scrape_regencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore Provinces Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-provinces.lock
          key: dvc-lock-provinces-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore Regencies Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-regencies.lock
          key: dvc-lock-regencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Merge DVC Locks
        run: |
          python -c '
          import yaml
          merged = {"schema": "2.0", "stages": {}}
          for name in ["provinces", "regencies"]:
              with open(f"dvc-lock-{name}.lock") as f:
                  lock_data = yaml.safe_load(f) or {}
                  merged["stages"].update(lock_data.get("stages", {}))
          with open("dvc.lock", "w") as f:
              yaml.dump(merged, f)
          '

      - name: DVC Pull Raw Data
        run: dvc pull

      - name: Run Transform
        run: dvc repro transform

      - name: DVC Push
        run: dvc push

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-transform.lock

      - name: Cache Transform Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-transform.lock
          key: dvc-lock-transform-${{ github.run_id }}-${{ github.run_attempt }}

  # ──────────────────────────────────────────────
  # Stage 3a: Exploratory Data Analysis
  # ──────────────────────────────────────────────
  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore Transform Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-transform.lock
          key: dvc-lock-transform-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup DVC Lock
        run: cp dvc-lock-transform.lock dvc.lock

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run EDA
        run: dvc repro eda

      - name: DVC Push
        run: dvc push

      - name: Post EDA Report to Step Summary
        run: cat reports/eda_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload EDA Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eda-report
          path: reports/eda_summary.md

      - name: Install CML
        run: npm install -g @cmlrun/cml

      - name: Generate & Post CML EDA Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/eda_summary.md \
            --figures reports/figures/eda_top_provinces.png reports/figures/eda_top_regencies_transaksi.png \
            --output reports/cml_eda.md \
            --title "📊 CML: Laporan EDA SIMKOPDES"
          cml comment create reports/cml_eda.md

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-eda.lock

      - name: Cache EDA Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-eda.lock
          key: dvc-lock-eda-${{ github.run_id }}-${{ github.run_attempt }}

  # ──────────────────────────────────────────────
  # Stage 3b: ML Preprocessing
  # ──────────────────────────────────────────────
  preprocess:
    name: ML Preprocessing
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore Transform Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-transform.lock
          key: dvc-lock-transform-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup DVC Lock
        run: cp dvc-lock-transform.lock dvc.lock

      - name: DVC Pull Transformed Data
        run: dvc pull

      - name: Run Preprocessing
        run: dvc repro preprocess

      - name: DVC Push
        run: dvc push

      - name: Post Preprocess Report to Step Summary
        run: cat reports/preprocess_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Preprocess Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preprocess-report
          path: reports/preprocess_report.md

      - name: Install CML
        run: npm install -g @cmlrun/cml

      - name: Generate & Post CML Preprocess Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/preprocess_report.md \
            --figures reports/figures/preprocess_elbow_curve.png \
            --output reports/cml_preprocess.md \
            --title "⚙️ CML: Laporan Preprocessing SIMKOPDES"
          cml comment create reports/cml_preprocess.md

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-preprocess.lock

      - name: Cache Preprocess Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-preprocess.lock
          key: dvc-lock-preprocess-${{ github.run_id }}-${{ github.run_attempt }}

  # ──────────────────────────────────────────────
  # Stage 4: KMeans Clustering
  # ──────────────────────────────────────────────
  model:
    name: KMeans Clustering
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore Preprocess Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-preprocess.lock
          key: dvc-lock-preprocess-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup DVC Lock
        run: cp dvc-lock-preprocess.lock dvc.lock

      - name: DVC Pull Preprocessed & Transformed Data
        run: dvc pull

      - name: Run Model Training
        run: dvc repro model

      - name: DVC Push
        run: dvc push

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-model.lock

      - name: Cache Model Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-model.lock
          key: dvc-lock-model-${{ github.run_id }}-${{ github.run_attempt }}

  # ──────────────────────────────────────────────
  # Stage 5: Model Evaluation
  # ──────────────────────────────────────────────
  evaluate:
    name: Model Evaluation
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore EDA Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-eda.lock
          key: dvc-lock-eda-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore Model Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-model.lock
          key: dvc-lock-model-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Merge DVC Locks
        run: |
          python -c '
          import yaml
          merged = {"schema": "2.0", "stages": {}}
          for name in ["eda", "model"]:
              with open(f"dvc-lock-{name}.lock") as f:
                  lock_data = yaml.safe_load(f) or {}
                  merged["stages"].update(lock_data.get("stages", {}))
          with open("dvc.lock", "w") as f:
              yaml.dump(merged, f)
          '

      - name: DVC Pull All Upstream Data
        run: dvc pull

      - name: Run Evaluation
        run: dvc repro evaluate

      - name: DVC Push
        run: dvc push

      - name: Post Evaluation Report to Step Summary
        run: cat reports/evaluate_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Evaluation Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluate-report
          path: reports/evaluate_report.md

      - name: Install CML
        run: npm install -g @cmlrun/cml

      - name: Generate & Post CML Evaluate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/evaluate_report.md \
            --figures reports/figures/eval_pca_projection.png reports/figures/eval_cluster_distribution.png reports/figures/eval_avg_transaction.png \
            --output reports/cml_evaluate.md \
            --title "🔬 CML: Laporan Evaluasi Clustering SIMKOPDES"
          cml comment create reports/cml_evaluate.md

      - name: Copy Lock for Caching
        run: cp dvc.lock dvc-lock-evaluate.lock

      - name: Cache Evaluate Lock
        uses: actions/cache/save@v5
        with:
          path: dvc-lock-evaluate.lock
          key: dvc-lock-evaluate-${{ github.run_id }}-${{ github.run_attempt }}

  interpret:
    name: AI Interpretation
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pipeline Environment
        uses: ./.github/actions/setup-pipeline

      - name: Restore Evaluate Lock
        uses: actions/cache/restore@v5
        with:
          path: dvc-lock-evaluate.lock
          key: dvc-lock-evaluate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup DVC Lock
        run: cp dvc-lock-evaluate.lock dvc.lock

      - name: DVC Pull Upstream Data
        run: dvc pull

      - name: Run AI Interpretation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: dvc repro interpret

      - name: DVC Push
        run: dvc push

      - name: Post AI Interpretation Report to Step Summary
        run: cat reports/interpret_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload AI Interpretation Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interpret-report
          path: reports/interpret_report.md

      - name: Install CML
        run: npm install -g @cmlrun/cml

      - name: Generate & Post CML Interpret Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/utils/cml_utils.py \
            --report reports/interpret_report.md \
            --output reports/cml_interpret.md \
            --title "🤖 CML: Laporan Interpretasi AI SIMKOPDES"
          cml comment create reports/cml_interpret.md

      - name: Commit & Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update DVC tracking files and AI reports [skip ci]"
            git pull --rebase origin main
            git push
          fi

