name: SIMKOPDES End-to-End Data & ML Pipeline

on:
  workflow_dispatch:
    inputs:
      force_repro:
        description: 'Paksa eksekusi ulang seluruh stage pipeline DVC (--force)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari pukul 00:00 UTC

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  scrape_matrix:
    name: Parallel Scraping (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [scrape_provinces, scrape_regencies]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment & Playwright
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'true'

      - name: Reproduce Parallel DVC Stage (${{ matrix.stage }})
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force ${{ matrix.stage }}
          else
            dvc repro --pull ${{ matrix.stage }}
          fi

      - name: Push Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-${{ matrix.stage }}
          path: dvc.lock

  transform:
    name: Data Transformation & Geo-Enrichment
    needs: scrape_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce Transform Stage (with DVC Auto-Pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force transform
          else
            dvc repro --pull transform
          fi

      - name: Push Transformed Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-transform
          path: dvc.lock

  eda:
    name: Exploratory Data Analysis
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce EDA Stage (with DVC Auto-Pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force eda
          else
            dvc repro --pull eda
          fi

      - name: Push Reports to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-eda
          path: dvc.lock

  preprocess:
    name: ML Preprocessing & Feature Scaling
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce ML Preprocess Stage (with DVC Auto-Pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force preprocess
          else
            dvc repro --pull preprocess
          fi

      - name: Push Preprocessed Data to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-preprocess
          path: dvc.lock

  model:
    name: KMeans Clustering Modeling
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce Model Stage (with DVC Auto-Pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force model
          else
            dvc repro --pull model
          fi

      - name: Push Model Artifacts to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvc-lock-model
          path: dvc.lock

  evaluate:
    name: ML Model Evaluation & CML Report
    needs: [eda, model]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-dvc-env
        with:
          install_playwright: 'false'

      - name: Download Lockfile Artifacts
        uses: actions/download-artifact@v4

      - name: Reproduce Evaluate Stage (with DVC Auto-Pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_repro }}" = "true" ]; then
            dvc repro --pull --force evaluate
          else
            dvc repro --pull evaluate
          fi

      - name: Push Evaluation Reports to Cloudflare R2
        uses: ./.github/actions/dvc-r2-push
        with:
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v1

      - name: Generate & Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Laporan Pemrosesan Data & Machine Learning SIMKOPDES" > cml_report.md
          echo "" >> cml_report.md
          cat reports/eda_summary.md >> cml_report.md
          echo "" >> cml_report.md
          cat reports/clustering_report.md >> cml_report.md
          echo "" >> cml_report.md
          echo "## Metrik Evaluasi Model DVC" >> cml_report.md
          dvc metrics show --markdown >> cml_report.md

          cml comment create cml_report.md || echo "CML comment created."

      - name: Commit & Push Updated Lockfile, Models and Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock .dvc/config data/transform/.gitignore data/preprocess/.gitignore data/model/.gitignore models/.gitignore reports/
          git commit -m "auto: reproduce end-to-end ML pipeline stages [skip ci]" || echo "Tidak ada perubahan data."
          git push
