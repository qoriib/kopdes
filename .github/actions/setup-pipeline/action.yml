name: 'Setup Pipeline Environment'
description: 'Sets up Python, installs dependencies, sets up DVC, and optionally installs Playwright.'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.12'
  install-playwright:
    description: 'Whether to install Playwright chromium and dependencies'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Setup CML
      uses: iterative/setup-cml@v2

    - name: Prepare CML CI
      shell: bash
      run: cml ci

    - name: Setup DVC
      uses: treeverse/setup-dvc@v3

    - name: Cache DVC
      uses: actions/cache@v6
      with:
        path: .dvc/cache
        key: dvc-cache-${{ runner.os }}-${{ hashFiles('dvc.lock') }}
        restore-keys: |
          dvc-cache-${{ runner.os }}-

    - name: Install Playwright
      if: ${{ inputs.install-playwright == 'true' }}
      shell: bash
      run: playwright install chromium --with-deps
