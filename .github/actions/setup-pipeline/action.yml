name: 'Setup Pipeline Environment'
description: 'Sets up Python, installs dependencies, sets up DVC, and optionally installs Playwright.'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Setup CML
      uses: iterative/setup-cml@v2

    - name: Setup DVC
      uses: treeverse/setup-dvc@v3

    - name: Restore DVC Lock & Cache
      uses: actions/cache@v4
      with:
        path: |
          dvc.lock
          .dvc/cache
        key: dvc-cache-${{ github.sha }}-${{ github.run_id }}
        restore-keys: |
          dvc-cache-${{ github.sha }}-
          dvc-cache-

    - name: DVC Pull
      shell: bash
      run: dvc pull --run-cache
