stages:
  scrape_provinces:
    cmd: python scrape/scrape_provinces.py
    deps:
      - scrape/scrape_provinces.py
      - scrape/scraper_utils.py
    outs:
      - data/raw/scraped_provinces.csv

  scrape_regencies:
    cmd: python scrape/scrape_regencies.py
    deps:
      - scrape/scrape_regencies.py
      - scrape/scraper_utils.py
    params:
      - scrape.max_workers
      - scrape.start_province_id
      - scrape.end_province_id
    outs:
      - data/raw/scraped_regencies.csv

  preprocess:
    cmd: python scrape/preprocess.py
    deps:
      - scrape/preprocess.py
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
      - data/raw/province.json
      - data/raw/regency.json
    outs:
      - data/preprocess/cleaned_provinces.csv
      - data/preprocess/cleaned_regencies.csv

  eda:
    cmd: python scrape/eda.py
    deps:
      - scrape/eda.py
      - data/preprocess/cleaned_provinces.csv
      - data/preprocess/cleaned_regencies.csv
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/plots/top_provinces.csv:
          x: province_name
          y: jumlah_koperasi
          title: Top 10 Provinces by Koperasi Count
          cache: false
      - reports/plots/koperasi_status.csv:
          x: status
          y: jumlah
          title: Koperasi Compliance Status Breakdown
          cache: false
    outs:
      - reports/eda_summary.md
