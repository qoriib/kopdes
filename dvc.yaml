stages:
  data_understanding_collect:
    cmd: python src/data_understanding/collect_initial_data.py
    always_changed: true
    deps:
      - src/data_understanding/collect_initial_data.py
      - src/reports/initial_data_collection_template.md
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
    outs:
      - reports/initial_data_collection_report.md
      - reports/initial_data_collection_metrics.json

  data_understanding_describe:
    cmd: python src/data_understanding/describe_data.py
    always_changed: true
    deps:
      - src/data_understanding/describe_data.py
      - src/reports/data_description_template.md
      - data/raw/scraped_regencies.csv
    outs:
      - reports/data_description_report.md
      - reports/data_description_metrics.json

  data_understanding_explore:
    cmd: python src/data_understanding/explore_data.py
    always_changed: true
    deps:
      - src/data_understanding/explore_data.py
      - src/reports/data_exploration_template.md
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
    params:
      - data_understanding.top_provinces_limit
      - data_understanding.top_regencies_limit
    outs:
      - reports/data_exploration_report.md
      - reports/eda_metrics.json
      - reports/figures/eda_top_provinces.png
      - reports/figures/eda_top_regencies_transaksi.png
      - reports/figures/eda_correlation_matrix.png
      - reports/figures/eda_feature_distributions.png

  data_understanding_verify_quality:
    cmd: python src/data_understanding/verify_data_quality.py
    always_changed: true
    deps:
      - src/data_understanding/verify_data_quality.py
      - src/reports/data_quality_template.md
      - data/raw/scraped_regencies.csv
    outs:
      - reports/data_quality_report.md
      - reports/data_quality_metrics.json

  data_preparation_clean:
    cmd: python src/data_preparation/clean.py
    always_changed: true
    deps:
      - src/data_preparation/clean.py
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
      - data/raw/province.json
      - data/raw/regency.json
    outs:
      - data/prepared/cleaned_provinces.csv
      - data/prepared/cleaned_regencies.csv

  data_preparation_transform:
    cmd: python src/data_preparation/transform.py
    always_changed: true
    deps:
      - src/data_preparation/transform.py
      - data/prepared/cleaned_regencies.csv
    params:
      - data_preparation.log_transform_features
    outs:
      - data/prepared/scaled_features.csv
      - data/prepared/preparation_meta.json

  modeling_train:
    cmd: python src/modeling/train.py
    always_changed: true
    deps:
      - src/modeling/train.py
      - data/prepared/scaled_features.csv
      - data/prepared/cleaned_regencies.csv
    params:
      - modeling.min_k
      - modeling.max_k
      - modeling.random_state
      - modeling.n_init
      - modeling.kneedle.curve
      - modeling.kneedle.direction
      - modeling.fallback_k
      - modeling.override_k
      - modeling.selected_features
    outs:
      - models/kmeans_model.pkl
      - data/modeling/clustered_regencies.csv
      - reports/figures/model_elbow_curve.png

  evaluation_metrics:
    cmd: python src/evaluation/evaluate.py
    always_changed: true
    deps:
      - src/evaluation/evaluate.py
      - src/reports/evaluate_report_template.md
      - data/prepared/scaled_features.csv
      - data/modeling/clustered_regencies.csv
      - models/kmeans_model.pkl
    params:
      - modeling.selected_features
      - evaluation.target_silhouette_min
    outs:
      - reports/evaluate_report.md
      - reports/evaluate_metrics.json
      - reports/figures/eval_pca_projection.png
      - reports/figures/eval_cluster_distribution.png
      - reports/figures/eval_avg_transaction.png

  evaluation_interpret:
    cmd: python src/evaluation/interpret.py
    always_changed: true
    deps:
      - src/evaluation/interpret.py
      - src/reports/interpret_report_template.md
      - reports/evaluate_metrics.json
      - data/modeling/clustered_regencies.csv
    params:
      - interpret.model
      - interpret.max_tokens
      - modeling.selected_features
    outs:
      - reports/interpret_labels.json
      - reports/interpret_report.md

  deployment_seed:
    cmd: python src/deployment/seed.py
    always_changed: true
    deps:
      - src/deployment/seed.py
      - data/prepared/cleaned_provinces.csv
      - data/modeling/clustered_regencies.csv
      - reports/evaluate_metrics.json
      - reports/interpret_report.md
      - reports/interpret_labels.json
    outs:
      - data/seed.sql

artifacts:
  kmeans-model:
    path: models/kmeans_model.pkl
    type: model
    desc: "K-Means clustering model trained on regency data."
    labels:
      - kmeans
      - model
      - clustering
  clustered-regencies:
    path: data/modeling/clustered_regencies.csv
    type: dataset
    desc: "Clustered regencies dataset containing assigned cluster labels and details."
    labels:
      - dataset
      - regencies
