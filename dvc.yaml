stages:
  scrape_provinces:
    cmd: python scrape/scrape_provinces.py
    deps:
      - scrape/scrape_provinces.py
      - scrape/scraper_utils.py
    outs:
      - data/raw/scraped_provinces.csv

  scrape_regencies:
    cmd: python scrape/scrape_regencies.py
    deps:
      - scrape/scrape_regencies.py
      - scrape/scraper_utils.py
    params:
      - scrape.max_workers
      - scrape.start_province_id
      - scrape.end_province_id
    outs:
      - data/raw/scraped_regencies.csv
