stages:
  transform:
    cmd: python src/transform.py
    always_changed: true
    deps:
      - src/transform.py
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
      - data/raw/province.json
      - data/raw/regency.json
    outs:
      - data/transform/transformed_provinces.csv
      - data/transform/transformed_regencies.csv

  eda:
    cmd: python src/eda.py
    always_changed: true
    deps:
      - src/eda.py
      - src/reports/eda_summary_template.md
      - data/transform/transformed_provinces.csv
      - data/transform/transformed_regencies.csv
    params:
      - eda.top_provinces_limit
      - eda.top_regencies_limit
    outs:
      - reports/eda_summary.md
      - reports/eda_metrics.json
      - reports/figures/eda_top_provinces.png
      - reports/figures/eda_top_regencies_transaksi.png

  preprocess:
    cmd: python src/preprocess.py
    always_changed: true
    deps:
      - src/preprocess.py
      - src/reports/preprocess_report_template.md
      - data/transform/transformed_regencies.csv
    params:
      - preprocess.min_k
      - preprocess.max_k
      - preprocess.random_state
      - preprocess.n_init
      - preprocess.kneedle.curve
      - preprocess.kneedle.direction
      - preprocess.fallback_k
    outs:
      - data/preprocess/scaled_features.csv
      - data/preprocess/preprocess_meta.json
      - reports/preprocess_report.md
      - reports/figures/preprocess_elbow_curve.png

  model:
    cmd: python src/model.py
    always_changed: true
    deps:
      - src/model.py
      - data/preprocess/scaled_features.csv
      - data/preprocess/preprocess_meta.json
      - data/transform/transformed_regencies.csv
    params:
      - model.random_state
      - model.n_init
      - model.override_k
      - model.selected_features
    outs:
      - models/kmeans_model.pkl
      - data/model/clustered_regencies.csv

  evaluate:
    cmd: python src/evaluate.py
    always_changed: true
    deps:
      - src/evaluate.py
      - src/reports/evaluate_report_template.md
      - data/preprocess/scaled_features.csv
      - data/model/clustered_regencies.csv
      - models/kmeans_model.pkl
    params:
      - model.selected_features
    outs:
      - reports/evaluate_report.md
      - reports/evaluate_metrics.json
      - reports/figures/eval_pca_projection.png
      - reports/figures/eval_cluster_distribution.png
      - reports/figures/eval_avg_transaction.png

  interpret:
    cmd: python src/interpret.py
    always_changed: true
    deps:
      - src/interpret.py
      - src/reports/interpret_report_template.md
      - reports/evaluate_metrics.json
      - data/model/clustered_regencies.csv
    params:
      - interpret.model
      - interpret.max_tokens
    outs:
      - reports/interpret_labels.json
      - reports/interpret_report.md

  store:
    cmd: python src/store.py
    always_changed: true
    deps:
      - src/store.py
      - data/transform/transformed_provinces.csv
      - data/model/clustered_regencies.csv
      - reports/evaluate_metrics.json
      - reports/interpret_report.md
      - reports/interpret_labels.json
    outs:
      - data/seed.sql

artifacts:
  kmeans-model:
    path: models/kmeans_model.pkl
    type: model
    desc: "K-Means clustering model trained on SIMKOPDES regency data."
    labels:
      - kmeans
      - model
      - clustering
  clustered-regencies:
    path: data/model/clustered_regencies.csv
    type: dataset
    desc: "Clustered regencies dataset containing assigned cluster labels and details."
    labels:
      - dataset
      - regencies
