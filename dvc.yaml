stages:
  scrape_provinces:
    cmd: python scrape/scrape_provinces.py
    deps:
      - scrape/scrape_provinces.py
      - scrape/scraper_utils.py
    outs:
      - data/raw/scraped_provinces.csv

  scrape_regencies:
    cmd: python scrape/scrape_regencies.py
    deps:
      - scrape/scrape_regencies.py
      - scrape/scraper_utils.py
    params:
      - scrape.max_workers
      - scrape.start_province_id
      - scrape.end_province_id
    outs:
      - data/raw/scraped_regencies.csv

  transform:
    cmd: python scrape/transform.py
    deps:
      - scrape/transform.py
      - data/raw/scraped_provinces.csv
      - data/raw/scraped_regencies.csv
      - data/raw/province.json
      - data/raw/regency.json
    outs:
      - data/transform/transformed_provinces.csv
      - data/transform/transformed_regencies.csv

  eda:
    cmd: python scrape/eda.py
    deps:
      - scrape/eda.py
      - data/transform/transformed_provinces.csv
      - data/transform/transformed_regencies.csv
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/eda_summary.md
