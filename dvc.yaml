stages:
  fetch_geo_json:
    cmd: python scrape/fetch_openadmin.py
    deps:
      - scrape/fetch_openadmin.py
    outs:
      - data/raw/province.json
      - data/raw/regency.json

  scrape_provinces:
    cmd: python scrape/scrape_provinces.py
    deps:
      - scrape/scrape_provinces.py
      - scrape/scraper_utils.py
    outs:
      - data/raw/scraped_provinces.csv

  scrape_districts:
    cmd: python scrape/scrape_districts.py
    deps:
      - scrape/scrape_districts.py
      - scrape/scraper_utils.py
    outs:
      - data/raw/scraped_districts.csv
