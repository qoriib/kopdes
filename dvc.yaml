stages:
  understanding:
    cmd: papermill src/1_understanding.ipynb src/outs/1_understanding.ipynb
    deps:
      - src/1_understanding.ipynb
      - src/config.py
      - data/scrape/scraped_regencies.csv
      - data/scrape/scraped_provinces.csv
    outs:
      - src/outs/1_understanding.ipynb
      - data/1_understanding/cleaned_provinces.csv
      - data/1_understanding/cleaned_regencies.csv

  preparation:
    cmd: papermill src/2_preparation.ipynb src/outs/2_preparation.ipynb
    deps:
      - src/2_preparation.ipynb
      - src/config.py
      - data/1_understanding/cleaned_provinces.csv
      - data/1_understanding/cleaned_regencies.csv
      - data/2_preparation/province.json
      - data/2_preparation/regency.json
    outs:
      - src/outs/2_preparation.ipynb
      - data/2_preparation/cleaned_provinces.csv
      - data/2_preparation/cleaned_regencies.csv
      - data/2_preparation/scaled_features.csv

  modeling:
    cmd: papermill src/3_modeling.ipynb src/outs/3_modeling.ipynb -p K_MIN ${modeling.k_min} -p K_MAX ${modeling.k_max} -p RANDOM_STATE ${modeling.random_state}
    deps:
      - src/3_modeling.ipynb
      - src/config.py
      - data/2_preparation/cleaned_regencies.csv
      - data/2_preparation/scaled_features.csv
    params:
      - modeling.k_min
      - modeling.k_max
      - modeling.random_state
    outs:
      - src/outs/3_modeling.ipynb
      - models/kmeans_model.pkl
      - data/3_modeling/clustered_regencies.csv

  evaluation:
    cmd: papermill src/4_evaluation.ipynb src/outs/4_evaluation.ipynb -p TARGET_SILHOUETTE_MIN ${evaluation.target_silhouette_min}
    deps:
      - src/4_evaluation.ipynb
      - src/config.py
      - data/3_modeling/clustered_regencies.csv
      - data/2_preparation/scaled_features.csv
    params:
      - evaluation.target_silhouette_min
    outs:
      - src/outs/4_evaluation.ipynb

  deployment:
    cmd: papermill src/5_deployment.ipynb src/outs/5_deployment.ipynb -p MODEL "${deployment.model}" -p MAX_TOKENS ${deployment.max_tokens}
    deps:
      - src/5_deployment.ipynb
      - src/config.py
      - data/2_preparation/cleaned_provinces.csv
      - data/3_modeling/clustered_regencies.csv
    params:
      - deployment.model
      - deployment.max_tokens
    outs:
      - src/outs/5_deployment.ipynb
      - data/5_deployment/seed.sql
