data_understanding:
  top_provinces_limit: 10
  top_regencies_limit: 10

data_preparation:
  log_transform_features:
    - total_koperasi
    - simpanan_pokok
    - simpanan_wajib
    - volume_transaksi
    - nilai_transaksi

modeling:
  min_k: 2
  max_k: 10
  random_state: 42
  n_init: 10
  kneedle:
    curve: "convex"
    direction: "decreasing"
  fallback_k: 3
  override_k: null
  selected_features:
    - total_koperasi
    - rasio_nib
    - rasio_npwp
    - rasio_rat
    - simpanan_pokok
    - simpanan_wajib
    - volume_transaksi
    - nilai_transaksi

evaluation:
  target_silhouette_min: 0.50

interpret:
  model: "@cf/openai/gpt-oss-120b"
  max_tokens: 3000
