scrape:
  target_url: "https://simkopdes.go.id/pers/dashboard"
  base_url_template: "https://simkopdes.go.id/pers/dashboard/district/{id}"
  table_index: 2
  max_workers: 5

eda:
  top_provinces_limit: 10
  top_regencies_limit: 5

preprocess:
  min_k: 2
  max_k: 8
  random_state: 42
  n_init: 10
  kneedle:
    curve: "convex"
    direction: "decreasing"
  fallback_k: 3

model:
  random_state: 42
  n_init: 10
  override_k: null

interpret:
  model: "@cf/openai/gpt-oss-120b"
  max_tokens: 3000
