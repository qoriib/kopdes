# Pipeline Hyperparameters & Settings per CRISP-DM Stage

scraping:
  table_index: 2
  max_workers: 5
  target_url: "https://simkopdes.go.id/pers/dashboard"
  base_url_template: "https://simkopdes.go.id/pers/dashboard/district/{id}"

modeling:
  k_min: 2
  k_max: 10
  random_state: 42

evaluation:
  target_silhouette_min: 0.50
  model: "@cf/openai/gpt-oss-120b"
  max_tokens: 3000
